{% load static %}
{% csrf_token %}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static '/css/main.css' %}">
    <title>LITReview</title>
</head>
<body id="login-body">
    <div class="login-container">
        <div class="logo">
            <img src="{% static '/img/logo.png' %}" alt="">
        </div>
        <div class="content">
            <div class="register">
                <p>Inscrivez-vous maintenant</p>
                <a class="action-button" href="{% url 'signup' %}">S'inscrire</a>
            </div>
            <div class="login">
                <p>Connectez-vous</p>
                <form method="post">
                    {% csrf_token %}
                    <input type="text" name="username" placeholder="Nom d'utilisateur" maxlength="63" required="" id="id_username">
                    <input type="password" name="password" placeholder="Mot de passe" maxlength="63" required="" id="id_password">
                    <button class="action-button" type="submit" >Se connecter</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
